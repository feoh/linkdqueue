---
name: Desktop CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop workspace
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux WebKit prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: >-
            desktop-cargo-${{ runner.os }}-rust-1.92.0-${{
            hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ runner.os }}-rust-1.92.0-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Type-check Svelte
        run: npm run check

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Check serialized contracts
        run: npm run test:contracts

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: >-
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: |
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets -- -D warnings

      - name: Run Rust tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml

  browser-e2e:
    name: Verify browser evidence (not native Tauri)
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser evidence
        run: npm run test:e2e

      - name: Upload browser traces and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linkdqueue-browser-evidence-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            desktop/test-results/
            desktop/playwright-report/

  linkding-integration:
    name: Verify disposable Linkding compatibility
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'

      - name: Run pinned disposable Linkding contract test
        shell: bash
        run: |
          set -euo pipefail
          container_name="linkdqueue-q04-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          container_id="$({
            docker run --detach --rm \
              --name "$container_name" \
              --mount type=tmpfs,destination=/etc/linkding/data \
              --publish 127.0.0.1::9090 \
              --env LD_CONTEXT_PATH=linkding/ \
              --env LD_DISABLE_BACKGROUND_TASKS=True \
              --env LD_SUPERUSER_NAME=fixture-admin \
              --env LD_SUPERUSER_PASSWORD=fixture-password \
              sissbruecker/linkding:1.46.2
          })"

          port=""
          status=""
          for _ in $(seq 1 90); do
            port="$(docker port "$container_id" 9090/tcp \
              | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p' \
              | head -1)"
            if [ -n "$port" ]; then
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' \
                "http://127.0.0.1:${port}/linkding/api/user/profile/" || true)"
              if [ "$status" = 401 ]; then
                break
              fi
            fi
            sleep 1
          done
          test "$port" != ""
          test "$status" = 401

          token="$(docker exec "$container_id" sh -c '
            PATH=/etc/linkding/.venv/bin:/usr/local/bin:/usr/bin:/bin \
              python manage.py shell -c "
                from bookmarks.models import ApiToken
                from django.contrib.auth import get_user_model
                print(ApiToken.objects.create(
                  user=get_user_model().objects.get(username=\\\"fixture-admin\\\"),
                  name=\\\"q04\\\"
                ).key)
              "
            ' | tail -n 1)"
          test "${#token}" -eq 40

          LINKDING_TEST_BASE_URL="http://127.0.0.1:${port}/linkding" \
          LINKDING_TEST_TOKEN="$token" \
            cargo test --manifest-path desktop/src-tauri/Cargo.toml \
              --test linkding_live -- --ignored

  linux-bundle:
    name: Build Linux x86_64 candidate bundles
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build unsigned candidate bundles
        run: npm run tauri -- build --bundles appimage,deb --ci

      - name: Inspect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#appimage[@]}" -eq 1
          test "${#deb[@]}" -eq 1
          file "${appimage[0]}" | grep -E 'ELF 64-bit.*x86-64'
          dpkg-deb -f "${deb[0]}" Package Version Architecture
          test "$(dpkg-deb -f "${deb[0]}" Version)" = '2.0.0'
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = 'amd64'
          sha256sum "${appimage[0]}" "${deb[0]}" | tee linux-artifacts.sha256

      - name: Upload unsigned candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkdqueue-linux-x86_64-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/linux-artifacts.sha256

  macos-bundle:
    name: Build macOS ${{ matrix.architecture }} candidate bundles (unsigned)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is the hosted Apple Silicon runner; macos-13 is Intel.
          - architecture: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - architecture: x86_64
            runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Record macOS Keychain backend and compile it
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --manifest-path src-tauri/Cargo.toml \
            --target '${{ matrix.target }}' -e features \
            | tee "macos-${{ matrix.architecture }}-keychain-tree.txt"
          grep -E 'keyring v3\.6\.3|security-framework' \
            "macos-${{ matrix.architecture }}-keychain-tree.txt"
          cargo check --manifest-path src-tauri/Cargo.toml \
            --target '${{ matrix.target }}'

      - name: Build unsigned developer bundles
        run: >-
          npm run tauri -- build --ci --no-sign --target '${{ matrix.target }}'
          --bundles app,dmg

      - name: Inspect architecture and Info.plist
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [[ ! -d "$bundle_root" ]]; then
            bundle_root="src-tauri/target/release/bundle"
          fi
          apps=("$bundle_root"/macos/*.app)
          dmgs=("$bundle_root"/dmg/*.dmg)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          test "${#dmgs[@]}" -eq 1 && test -f "${dmgs[0]}"
          ./scripts/validate-macos-bundle.sh '${{ matrix.architecture }}' \
            "${apps[0]}" "${dmgs[0]}" | tee \
            "macos-${{ matrix.architecture }}-bundle-evidence.txt"
          mkdir -p macos-artifacts
          artifact_prefix="macos-artifacts/linkdqueue-desktop-macos-"
          artifact_prefix="${artifact_prefix}${{ matrix.architecture }}"
          app_artifact="${artifact_prefix}-developer-unsigned.app"
          dmg_artifact="${artifact_prefix}-developer-unsigned.dmg"
          ditto "${apps[0]}" "$app_artifact"
          cp "${dmgs[0]}" "$dmg_artifact"
          shasum -a 256 macos-artifacts/* \
            | tee "macos-${{ matrix.architecture }}-artifacts.sha256"

      - name: Upload unsigned developer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ format('linkdqueue-macos-{0}-developer-unsigned-{1}',
            matrix.architecture, github.sha) }}
          if-no-files-found: error
          path: |
            desktop/macos-artifacts/*
            desktop/macos-${{ matrix.architecture }}-keychain-tree.txt
            desktop/macos-${{ matrix.architecture }}-bundle-evidence.txt
            desktop/macos-${{ matrix.architecture }}-artifacts.sha256

  windows-bundle:
    name: Build Windows x86_64 NSIS candidate installer (unsigned)
    needs: validate
    runs-on: windows-2022
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Record Windows Credential Manager backend and compile it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo tree --manifest-path src-tauri/Cargo.toml `
            --target x86_64-pc-windows-msvc -e features `
            | Tee-Object -FilePath windows-x86_64-keyring-tree.txt
          Select-String -Path windows-x86_64-keyring-tree.txt `
            -Pattern 'keyring v3\.6\.3|windows-sys'
          cargo check --manifest-path src-tauri/Cargo.toml `
            --target x86_64-pc-windows-msvc

      - name: Build unsigned NSIS installer
        run: >-
          npm run tauri -- build --ci --no-sign
          --target x86_64-pc-windows-msvc --bundles nsis

      - name: Inspect NSIS PE architecture and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle_root = 'src-tauri/target/'
          $bundle_root += 'x86_64-pc-windows-msvc/release/bundle/nsis'
          if (-not (Test-Path $bundle_root)) {
            $bundle_root = 'src-tauri/target/release/bundle/nsis'
          }
          $installers = @(Get-ChildItem "$bundle_root/*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, got $($installers.Count)"
          }
          $installer = $installers[0]
          $bytes = [IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4d -or
              $bytes[1] -ne 0x5a) {
            throw 'Installer is not a PE file'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
              $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
            throw 'Installer has no PE signature'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw "Expected x86_64 PE machine, got 0x$('{0:x4}' -f $machine)"
          }
          $version = $installer.VersionInfo.FileVersion
          if ($version -notmatch '^2\.0\.0') {
            throw "Unexpected installer version: $version"
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          $signature_status = $signature.Status
          [PSCustomObject]@{
            Path = $installer.FullName
            Architecture = 'x86_64 (PE 0x8664)'
            FileVersion = $version
            SignatureStatus = $signature_status
          } | Format-List
          Get-FileHash $installer.FullName -Algorithm SHA256 `
            | Tee-Object -FilePath windows-x86_64-installer.sha256

      - name: Upload unsigned candidate installer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: >-
            linkdqueue-windows-x86_64-nsis-developer-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/windows-x86_64-keyring-tree.txt
            desktop/windows-x86_64-installer.sha256

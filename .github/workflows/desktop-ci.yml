---
name: Desktop CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop workspace
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux WebKit prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: >-
            desktop-cargo-${{ runner.os }}-rust-1.92.0-${{
            hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ runner.os }}-rust-1.92.0-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Type-check Svelte
        run: npm run check

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Check serialized contracts
        run: npm run test:contracts

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: >-
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: |
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets -- -D warnings

      - name: Run Rust tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml

  browser-e2e:
    name: Verify browser evidence (not native Tauri)
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser evidence
        run: npm run test:e2e

      - name: Upload browser traces and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linkdqueue-browser-evidence-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            desktop/test-results/
            desktop/playwright-report/

  linkding-integration:
    name: Verify disposable Linkding compatibility
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'

      - name: Run pinned disposable Linkding contract test
        shell: bash
        run: |
          set -euo pipefail
          container_name="linkdqueue-q04-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          container_id="$({
            docker run --detach --rm \
              --name "$container_name" \
              --mount type=tmpfs,destination=/etc/linkding/data \
              --publish 127.0.0.1::9090 \
              --env LD_CONTEXT_PATH=linkding/ \
              --env LD_DISABLE_BACKGROUND_TASKS=True \
              --env LD_SUPERUSER_NAME=fixture-admin \
              --env LD_SUPERUSER_PASSWORD=fixture-password \
              sissbruecker/linkding:1.46.2
          })"

          port=""
          status=""
          for _ in $(seq 1 90); do
            port="$(docker port "$container_id" 9090/tcp \
              | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p' \
              | head -1)"
            if [ -n "$port" ]; then
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' \
                "http://127.0.0.1:${port}/linkding/api/user/profile/" || true)"
              if [ "$status" = 401 ]; then
                break
              fi
            fi
            sleep 1
          done
          test "$port" != ""
          test "$status" = 401

          token="$(docker exec "$container_id" sh -c '
            PATH=/etc/linkding/.venv/bin:/usr/local/bin:/usr/bin:/bin \
              python manage.py shell -c "
                from bookmarks.models import ApiToken
                from django.contrib.auth import get_user_model
                print(ApiToken.objects.create(
                  user=get_user_model().objects.get(username=\\\"fixture-admin\\\"),
                  name=\\\"q04\\\"
                ).key)
              "
            ' | tail -n 1)"
          test "${#token}" -eq 40

          LINKDING_TEST_BASE_URL="http://127.0.0.1:${port}/linkding" \
          LINKDING_TEST_TOKEN="$token" \
            cargo test --manifest-path desktop/src-tauri/Cargo.toml \
              --test linkding_live -- --ignored

  linux-bundle:
    name: Build Linux x86_64 candidate bundles
    needs: validate
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build unsigned candidate bundles
        run: npm run tauri -- build --bundles appimage,deb --ci

      - name: Inspect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#appimage[@]}" -eq 1
          test "${#deb[@]}" -eq 1
          file "${appimage[0]}" | grep -E 'ELF 64-bit.*x86-64'
          dpkg-deb -f "${deb[0]}" Package Version Architecture
          test "$(dpkg-deb -f "${deb[0]}" Version)" = '2.0.0'
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = 'amd64'
          sha256sum "${appimage[0]}" "${deb[0]}" | tee linux-artifacts.sha256

      - name: Upload unsigned candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkdqueue-linux-x86_64-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/linux-artifacts.sha256

  macos-bundle:
    name: Build macOS ${{ matrix.architecture }} candidate bundles (unsigned)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is the hosted Apple Silicon runner; macos-13 is Intel.
          - architecture: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - architecture: x86_64
            runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Record macOS Keychain backend and compile it
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --manifest-path src-tauri/Cargo.toml --target '${{ matrix.target }}' \
            -e features | tee "macos-${{ matrix.architecture }}-keychain-tree.txt"
          grep -E 'keyring v3\.6\.3|security-framework' \
            "macos-${{ matrix.architecture }}-keychain-tree.txt"
          cargo check --manifest-path src-tauri/Cargo.toml \
            --target '${{ matrix.target }}'

      - name: Build unsigned developer bundles
        run: >-
          npm run tauri -- build --ci --no-sign --target '${{ matrix.target }}'
          --bundles app,dmg

      - name: Inspect architecture and Info.plist
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [[ ! -d "$bundle_root" ]]; then
            bundle_root="src-tauri/target/release/bundle"
          fi
          apps=("$bundle_root"/macos/*.app)
          dmgs=("$bundle_root"/dmg/*.dmg)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          test "${#dmgs[@]}" -eq 1 && test -f "${dmgs[0]}"
          ./scripts/validate-macos-bundle.sh '${{ matrix.architecture }}' \
            "${apps[0]}" "${dmgs[0]}" | tee \
            "macos-${{ matrix.architecture }}-bundle-evidence.txt"
          mkdir -p macos-artifacts
          ditto "${apps[0]}" \
            "macos-artifacts/linkdqueue-desktop-macos-${{ matrix.architecture }}-developer-unsigned.app"
          cp "${dmgs[0]}" \
            "macos-artifacts/linkdqueue-desktop-macos-${{ matrix.architecture }}-developer-unsigned.dmg"
          shasum -a 256 macos-artifacts/* \
            | tee "macos-${{ matrix.architecture }}-artifacts.sha256"

      - name: Upload unsigned developer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkdqueue-macos-${{ matrix.architecture }}-developer-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/macos-artifacts/*
            desktop/macos-${{ matrix.architecture }}-keychain-tree.txt
            desktop/macos-${{ matrix.architecture }}-bundle-evidence.txt
            desktop/macos-${{ matrix.architecture }}-artifacts.sha256

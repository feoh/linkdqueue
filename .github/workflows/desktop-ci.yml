---
name: Desktop CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop workspace
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux WebKit prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget
        working-directory: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: >-
            desktop-cargo-${{ runner.os }}-rust-1.92.0-${{
            hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ runner.os }}-rust-1.92.0-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Type-check Svelte
        run: npm run check

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Check serialized contracts
        run: npm run test:contracts

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: >-
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: |
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets -- -D warnings

      - name: Run Rust tests
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml

  linkding-integration:
    name: Verify disposable Linkding compatibility
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'

      - name: Run pinned disposable Linkding contract test
        shell: bash
        run: |
          set -euo pipefail
          container_name="linkdqueue-q04-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          container_id="$({
            docker run --detach --rm \
              --name "$container_name" \
              --mount type=tmpfs,destination=/etc/linkding/data \
              --publish 127.0.0.1::9090 \
              --env LD_CONTEXT_PATH=linkding/ \
              --env LD_DISABLE_BACKGROUND_TASKS=True \
              --env LD_SUPERUSER_NAME=fixture-admin \
              --env LD_SUPERUSER_PASSWORD=fixture-password \
              sissbruecker/linkding:1.46.2
          })"

          port=""
          status=""
          for _ in $(seq 1 90); do
            port="$(docker port "$container_id" 9090/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p' | head -1)"
            if [ -n "$port" ]; then
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                "http://127.0.0.1:${port}/linkding/api/user/profile/" || true)"
              if [ "$status" = 401 ]; then
                break
              fi
            fi
            sleep 1
          done
          test "$port" != ""
          test "$status" = 401

          token="$(docker exec "$container_id" sh -c \
            'PATH=/etc/linkding/.venv/bin:/usr/local/bin:/usr/bin:/bin python manage.py shell -c "from bookmarks.models import ApiToken; from django.contrib.auth import get_user_model; print(ApiToken.objects.create(user=get_user_model().objects.get(username=\\\"fixture-admin\\\"),name=\\\"q04\\\").key)"' \
            | tail -n 1)"
          test "${#token}" -eq 40

          LINKDING_TEST_BASE_URL="http://127.0.0.1:${port}/linkding" \
          LINKDING_TEST_TOKEN="$token" \
            cargo test --manifest-path desktop/src-tauri/Cargo.toml \
              --test linkding_live -- --ignored

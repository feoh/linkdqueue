[package]
name = "linkdqueue-desktop"
version = "2.0.0"
description = "Linkdqueue Desktop"
authors = ["Christopher Patti"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "linkdqueue_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
url = "2.5.8"
keyring = { version = "=3.6.3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "vendored",
] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-opener = "=2.5.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[package]
name = "linkdqueue-desktop"
version = "2.0.0"
description = "Linkdqueue Desktop"
authors = ["Christopher Patti"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "linkdqueue_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
